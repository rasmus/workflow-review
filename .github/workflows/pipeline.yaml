name: pipeline

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: string
      # OPTIONAL ===================
      allow_drafts:
        required: false
        type: string
        default: "false"
      allow_forks:
        required: false
        type: string
        default: "false"
      allowlist:
        required: false
        type: string
        default: "rasmus"
      skip_ci:
        required: false
        type: string
        default: "false"
    secrets:
      openai_api_key:
        required: true

jobs:
  command:
    runs-on: ubuntu-latest

    outputs:
      continue: ${{ steps.command.outputs.continue }}
      pull_request: ${{ steps.pull_request.outputs.pull_request }}

    defaults:
      run:
        shell: bash

    permissions:
      pull-requests: write
      issues: write
      checks: read
      contents: read

    steps:
      - name: Command evaluation
        uses: github/command@v2
        id: command
        with:
          allowlist: "${{ inputs.allowlist }}"
          allow_drafts: "${{ inputs.allow_drafts }}"
          allow_forks: "${{ inputs.allow_forks }}"
          command: ".review"
          reaction: "eyes"
          skip_ci: ${{ inputs.skip_ci }}
          skip_reviews: "true"

      - name: Pull request info
        if: ${{ steps.command.outputs.continue == 'true' }}
        id: pull_request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.github_token }}
          result-encoding: json
          pull-number: ${{ inputs.pull_request_number }}
          script: |
            const pullNumber = Number(core.getInput('pull-number', { required: true }).trim());
            if (Number.isNaN(pullNumber)) {
              throw new Error(`Expected numeric pull request number but received: ${pullNumber}`);
            }

            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            core.setOutput('pull_request', JSON.stringify(data));
            return data;

  codex:
    runs-on: ubuntu-latest
    needs: command
    if: ${{ needs.command.outputs.continue == 'true' }}

    permissions:
      contents: read

    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Explicitly check out the PR's merge commit.
          ref: refs/pull/${{ fromJson(needs.command.outputs.pull_request).number }}/merge

      - name: Pre-fetch base and head refs for the PR
        run: |
          git fetch --no-tags origin \
            ${{ fromJson(needs.command.outputs.pull_request).base.ref }} \
            +refs/pull/${{ fromJson(needs.command.outputs.pull_request).number }}/head

      # If you want Codex to build and run code, install any dependencies that
      # need to be downloaded before the "Run Codex" step because Codex's
      # default sandbox disables network access.

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            This is PR #${{ fromJson(needs.command.outputs.pull_request).number }} for ${{ github.repository }}.
            Base SHA: ${{ fromJson(needs.command.outputs.pull_request).base.sha }}
            Head SHA: ${{ fromJson(needs.command.outputs.pull_request).head.sha }}

            Review ONLY the changes introduced by the PR.
            Suggest any improvements, potential bugs, or issues.
            Be concise and specific in your feedback.

            Pull request title and body:
            ----
            ${{ fromJson(needs.command.outputs.pull_request).title }}
            ${{ fromJson(needs.command.outputs.pull_request).body }}

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''

    permissions:
      pull-requests: write

    steps:
      - name: Report Codex feedback
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pull_request_number }},
              body: process.env.CODEX_FINAL_MESSAGE,
            });
