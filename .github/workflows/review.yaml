name: Perform a code review

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  checks: read
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yaml
    with:
      pull_request_number: ${{ github.event.issue.number }}
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
